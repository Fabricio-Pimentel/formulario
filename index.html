<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>Formulários</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <header>
            <h1>Academia de Heróis</h1>
            <p>Inscreva-se para participar da próxima missão.</p>
        </header>
        <main>
            <form action="#" method="get">
                <h2>Faça sua inscrição</h2>
                    <label for="nome">Nome do herói:</label>
                    <input id="nome" name="nome" type="text"/>
                    
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email"/>
                    
                    <label for="idade">Idade</label>
                    <input id="idade" name="idade" type="number"/>
                    
                    <label for="equipe">Escolha sua equipe:</label>
                    <select name="equipe" id="equipe">
                        <option>Liga da Justiça</option>
                        <option>Jovens Titãs</option>
                        <option>Vingadores</option>
                        <option>Quarteto Fantástico</option>
                    </select>

                <h2>Qual poder você prefere</h2>
                    <section>
                        <article class="opcao">
                            <input id="poder" name="poder" type="radio"/>
                            <label for="poder">Voar</label>
                        </article>
                         <article class="opcao">
                            <input id="poder" name="poder" type="radio"/>
                            <label for="poder">supervelocidade</label>
                        </article>
                        <article class="opcao">
                            <input id="poder" name="poder" type="radio"/>
                            <label for="poder">superforça</label>
                        </article>
                        <article class="opcao">
                            <input id="missao" name="missao" type="checkbox">
                            <label for="missao">Quero receber novas missões.</label>
                        </article>
                        <article class="pergunta">
                            <label for="porque">Por que você quer ser um herói?</label>
                            <textarea id="porque" name="porque" rows="4"></textarea>
                        </article>
                    </section>
                        <button type="submit">Enviar inscrição</button>
            </form>
        </main>
        <footer>
            <p>Prática de formulário HTML</p>
        </footer>
    </body>
</html>
